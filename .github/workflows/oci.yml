name: oci-retry
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: oci-retry
jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli
      - name: Configure
        env:
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: |
          mkdir -p ~/.oci
          echo "$OCI_KEY" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER }}
          tenancy=${{ secrets.OCI_TENANCY }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          region=eu-frankfurt-1
          key_file=/home/runner/.oci/key.pem
          EOF
      - name: Launch instance
        run: |
          EXISTING=$(oci compute instance list --compartment-id "${{ secrets.OCI_COMPARTMENT }}" \
            --display-name NeBuReSiOn --query 'data[?"lifecycle-state"!=`TERMINATED`] | length(@)' --raw-output)
          if [ "$EXISTING" != "0" ]; then echo "Instance already exists"; exit 0; fi
          for SHAPE in '{"ocpus":2,"memoryInGBs":12}' '{"ocpus":1,"memoryInGBs":6}'; do
            if oci compute instance launch \
              --availability-domain "${{ secrets.OCI_AD }}" \
              --compartment-id "${{ secrets.OCI_COMPARTMENT }}" \
              --shape VM.Standard.A1.Flex \
              --shape-config "$SHAPE" \
              --source-details '{"sourceType":"bootVolume","bootVolumeId":"${{ secrets.OCI_BOOT_VOLUME }}"}' \
              --subnet-id "${{ secrets.OCI_SUBNET }}" \
              --assign-public-ip true \
              --display-name NeBuReSiOn; then
              echo "Created with $SHAPE"; exit 0
            fi
          done
          echo "No capacity, will retry"
